<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AuthCRUD — Authentication & Management Dashboard</title>
  <meta name="description" content="A full-featured frontend for managing users and products via the Authentication CRUD backend API." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ═══════════════════ AUTH SCREEN ═══════════════════ -->
  <div id="auth-screen" class="screen active">
    <div class="auth-layout">
      <div class="auth-brand">
        <div class="brand-logo">
          <svg width="40" height="40" viewBox="0 0 40 40" fill="none">
            <rect width="40" height="40" rx="12" fill="hsl(220, 90%, 56%)"/>
            <path d="M20 8C15.582 8 12 11.582 12 16v2h-2v14h20V18h-2v-2c0-4.418-3.582-8-8-8zm0 3c2.761 0 5 2.239 5 5v2h-10v-2c0-2.761 2.239-5 5-5zm0 10a2 2 0 110 4 2 2 0 010-4z" fill="white"/>
          </svg>
        </div>
        <h1 class="brand-name">AuthCRUD</h1>
        <p class="brand-tagline">Manage users &amp; products with ease</p>
      </div>

      <div class="auth-card">
        <div class="auth-tabs">
          <button id="tab-login" class="auth-tab active" onclick="switchTab('login')">Sign In</button>
          <button id="tab-register" class="auth-tab" onclick="switchTab('register')">Register</button>
        </div>

        <!-- Login Form -->
        <form id="login-form" class="auth-form" onsubmit="handleLogin(event)">
          <div class="form-group">
            <label for="login-email">Email Address</label>
            <input id="login-email" type="email" placeholder="you@example.com" required autocomplete="email" />
          </div>
          <div class="form-group">
            <label for="login-password">Password</label>
            <div class="input-with-toggle">
              <input id="login-password" type="password" placeholder="Enter your password" required autocomplete="current-password" />
              <button type="button" class="eye-btn" onclick="togglePassword('login-password', this)">
                <svg class="eye-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
              </button>
            </div>
          </div>
          <div id="login-error" class="form-error hidden"></div>
          <button type="submit" id="login-btn" class="btn btn-primary btn-full">
            <span class="btn-text">Sign In</span>
            <span class="btn-spinner hidden"></span>
          </button>
        </form>

        <!-- Register Form -->
        <form id="register-form" class="auth-form hidden" onsubmit="handleRegister(event)">
          <div class="form-group">
            <label for="reg-name">Full Name</label>
            <input id="reg-name" type="text" placeholder="John Doe" required autocomplete="name" />
          </div>
          <div class="form-group">
            <label for="reg-email">Email Address</label>
            <input id="reg-email" type="email" placeholder="you@example.com" required autocomplete="email" />
          </div>
          <div class="form-group">
            <label for="reg-password">Password</label>
            <div class="input-with-toggle">
              <input id="reg-password" type="password" placeholder="Choose a password" required autocomplete="new-password" />
              <button type="button" class="eye-btn" onclick="togglePassword('reg-password', this)">
                <svg class="eye-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
              </button>
            </div>
          </div>
          <div id="register-error" class="form-error hidden"></div>
          <button type="submit" id="register-btn" class="btn btn-primary btn-full">
            <span class="btn-text">Create Account</span>
            <span class="btn-spinner hidden"></span>
          </button>
        </form>
      </div>
    </div>
  </div>

  <!-- ═══════════════════ DASHBOARD SCREEN ═══════════════════ -->
  <div id="dashboard-screen" class="screen hidden">
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-brand">
          <svg width="28" height="28" viewBox="0 0 40 40" fill="none">
            <rect width="40" height="40" rx="10" fill="hsl(220, 90%, 56%)"/>
            <path d="M20 8C15.582 8 12 11.582 12 16v2h-2v14h20V18h-2v-2c0-4.418-3.582-8-8-8zm0 3c2.761 0 5 2.239 5 5v2h-10v-2c0-2.761 2.239-5 5-5zm0 10a2 2 0 110 4 2 2 0 010-4z" fill="white"/>
          </svg>
          <span class="sidebar-title">AuthCRUD</span>
        </div>
        <button class="sidebar-close-btn" id="sidebar-close-btn" onclick="toggleSidebar()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>

      <nav class="sidebar-nav">
        <button class="nav-item active" id="nav-users" onclick="showPanel('users')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
          <span>Users</span>
        </button>
        <button class="nav-item" id="nav-products" onclick="showPanel('products')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 01-8 0"/></svg>
          <span>Products</span>
        </button>
      </nav>

      <div class="sidebar-user">
        <div class="user-avatar" id="sidebar-avatar">A</div>
        <div class="user-info">
          <span class="user-name" id="sidebar-name">User</span>
          <span class="user-email" id="sidebar-email">user@email.com</span>
        </div>
        <button class="logout-btn" onclick="handleLogout()" title="Sign out">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        </button>
      </div>
    </aside>

    <!-- Sidebar overlay for mobile -->
    <div class="sidebar-overlay" id="sidebar-overlay" onclick="toggleSidebar()"></div>

    <!-- Main Content -->
    <main class="main-content">
      <!-- Top bar -->
      <header class="topbar">
        <button class="hamburger-btn" onclick="toggleSidebar()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>
        <h2 class="topbar-title" id="topbar-title">Users</h2>
        <div class="topbar-actions">
          <button class="btn btn-primary btn-sm" id="create-btn" onclick="openCreateModal()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            <span id="create-btn-label">New User</span>
          </button>
        </div>
      </header>

      <!-- Toast notification -->
      <div id="toast" class="toast hidden"></div>

      <!-- ─── USERS PANEL ─── -->
      <section id="users-panel" class="panel active">
        <div class="panel-toolbar">
          <div class="search-box">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            <input id="users-search" type="text" placeholder="Search users…" oninput="filterUsers()" />
          </div>
          <button class="btn btn-ghost btn-sm" onclick="loadUsers()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 102.13-9.36L1 10"/></svg>
            Refresh
          </button>
        </div>
        <div id="users-loader" class="loader-wrap"><div class="loader"></div></div>
        <div id="users-empty" class="empty-state hidden">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
          <p>No users found</p>
        </div>
        <div id="users-table-wrap" class="table-wrap hidden">
          <table class="data-table" id="users-table">
            <thead>
              <tr>
                <th>Name</th>
                <th>Email</th>
                <th>Created</th>
                <th class="actions-col">Actions</th>
              </tr>
            </thead>
            <tbody id="users-tbody"></tbody>
          </table>
        </div>
      </section>

      <!-- ─── PRODUCTS PANEL ─── -->
      <section id="products-panel" class="panel hidden">
        <div class="panel-toolbar">
          <div class="search-box">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            <input id="products-search" type="text" placeholder="Search products…" oninput="filterProducts()" />
          </div>
          <button class="btn btn-ghost btn-sm" onclick="loadProducts()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 102.13-9.36L1 10"/></svg>
            Refresh
          </button>
        </div>
        <div id="products-loader" class="loader-wrap"><div class="loader"></div></div>
        <div id="products-empty" class="empty-state hidden">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 01-8 0"/></svg>
          <p>No products found</p>
        </div>
        <div id="products-table-wrap" class="table-wrap hidden">
          <table class="data-table" id="products-table">
            <thead>
              <tr>
                <th>Name</th>
                <th>Description</th>
                <th>Price</th>
                <th>Stock</th>
                <th>Created</th>
                <th class="actions-col">Actions</th>
              </tr>
            </thead>
            <tbody id="products-tbody"></tbody>
          </table>
        </div>
      </section>
    </main>
  </div>

  <!-- ═══════════════════ MODAL ═══════════════════ -->
  <div id="modal-overlay" class="modal-overlay hidden" onclick="closeModalOnOverlay(event)">
    <div class="modal" id="modal">
      <div class="modal-header">
        <h3 id="modal-title">Modal</h3>
        <button class="modal-close-btn" onclick="closeModal()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <div class="modal-body" id="modal-body"></div>
      <div class="modal-footer" id="modal-footer"></div>
    </div>
  </div>

  <!-- ═══════════════════ CONFIRM DIALOG ═══════════════════ -->
  <div id="confirm-overlay" class="modal-overlay hidden" onclick="closeConfirmOnOverlay(event)">
    <div class="modal modal-sm" id="confirm-dialog">
      <div class="modal-header">
        <h3 id="confirm-title">Confirm Delete</h3>
        <button class="modal-close-btn" onclick="closeConfirm()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <div class="modal-body">
        <p id="confirm-message">Are you sure you want to delete this item? This action cannot be undone.</p>
      </div>
      <div class="modal-footer">
        <button class="btn btn-ghost" onclick="closeConfirm()">Cancel</button>
        <button class="btn btn-danger" id="confirm-action-btn">Delete</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
